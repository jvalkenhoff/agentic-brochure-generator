name: Python syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            main.py \
            rag_search.py \
            research_agent.py \
            research_langchain.py \
            run_agentic.py \
            run_langgraph.py