
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Validate dependency lockfile
        run: uv lock --check

      - name: Check Python syntax
        run: |
          "$(uv python find)" -m compileall -q \
            main.py \
            research_agent.py \
            research_langchain.py \
            rag_search.py \
            run_agentic.py \
            run_langgraph.py